<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patohsi - Commission Request</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="commission_style.css">
    <link rel="stylesheet" href="commission_apply.css">
    <link rel="stylesheet" href="commission_request.css">
</head>
<body>
    <div class="deco-x-group deco-left">
        <img src="../assets/deco_x_blue.png" class="deco-x" alt=""><img src="../assets/deco_x_blue.png" class="deco-x" alt=""><img src="../assets/deco_x_blue.png" class="deco-x" alt="">
    </div>
    <div class="deco-x-group deco-right">
        <img src="../assets/deco_x_blue.png" class="deco-x" alt=""><img src="../assets/deco_x_blue.png" class="deco-x" alt=""><img src="../assets/deco_x_blue.png" class="deco-x" alt=""><img src="../assets/deco_x_blue.png" class="deco-x" alt=""><img src="../assets/deco_x_blue.png" class="deco-x" alt="">
    </div>

    <div class="commission-container commission-apply-container">
        <div class="lang-switch-container">
            <button class="lang-btn active" onclick="setLanguage('ko')">KR</button>
            <span class="lang-divider"> </span>
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>

        <header class="header-area apply-header">
            <span class="small-label">REQUEST</span>
            <h1 class="page-title lang-text" data-ko="커미션 신청서" data-en="Commission Request Form">커미션 신청서</h1>
            <p class="apply-lead lang-text"
               data-ko="항목을 작성하고 '신청서 보내기'를 누르면 내용이 바로 전달됩니다. 확인 후 입력하신 이메일로 승인 여부와 결제 안내를 드립니다."
               data-en="Fill in the fields and press “Send Request” to submit. After reviewing it, I will email you about approval and payment.">
                항목을 작성하고 '신청서 보내기'를 누르면 내용이 바로 전달됩니다. 확인 후 입력하신 이메일로 승인 여부와 결제 안내를 드립니다.
            </p>
            <a href="apply.html" class="back-btn lang-text" data-ko="신청 방법 선택으로 돌아가기" data-en="Back to Application Options">
                <span class="back-btn-arrow">←</span> 신청 방법 선택으로 돌아가기
            </a>
        </header>

        <section class="request-card">
            <form id="requestForm" class="request-form">
                <div class="form-row">
                    <label for="reqName" class="lang-text" data-ko="이름 / 닉네임" data-en="Name / Nickname">이름 / 닉네임</label>
                    <input type="text" id="reqName" name="reqName" required>
                </div>
                <div class="form-row">
                    <label for="reqEmail" class="lang-text" data-ko="이메일 (필수 · 승인/결제 안내를 받을 주소)" data-en="Email (required · for approval and payment info)">이메일 (필수 · 승인/결제 안내를 받을 주소)</label>
                    <input type="email" id="reqEmail" name="reqEmail" autocomplete="email" required>
                </div>
                <div class="form-row">
                    <label for="reqContact" class="lang-text" data-ko="연락처 (X, 디스코드 등)" data-en="Contact (X, Discord, etc.)">연락처 (X, 디스코드 등)</label>
                    <input type="text" id="reqContact" name="reqContact" required>
                </div>

                <!-- 커미션 종류: 태그 단일 선택 -->
                <div class="form-row">
                    <label class="lang-text" data-ko="커미션 종류 (하나 선택)" data-en="Commission Type (choose one)">커미션 종류 (하나 선택)</label>
                    <div id="typeTagGroup" class="tag-group" role="radiogroup">
                        <button type="button" class="tag-chip" data-value="두상 (15,000)">두상 · 15,000</button>
                        <button type="button" class="tag-chip" data-value="상반신 (30,000)">상반신 · 30,000</button>
                        <button type="button" class="tag-chip" data-value="하반신 (40,000)">하반신 · 40,000</button>
                        <button type="button" class="tag-chip" data-value="전신 (80,000)">전신 · 80,000</button>
                        <button type="button" class="tag-chip" data-value="자유 리퀘스트 (50,000)">자유 리퀘스트 · 50,000</button>
                        <button type="button" class="tag-chip" data-value="SD (10,000/개)">SD(개당) · 10,000</button>
                        <button type="button" class="tag-chip" data-value="흑백 삽화">흑백 삽화</button>
                    </div>
                    <input type="hidden" id="reqType" name="reqType" required>
                    <p class="tag-error lang-text" data-ko="커미션 종류를 선택해 주세요." data-en="Please choose a commission type.">커미션 종류를 선택해 주세요.</p>
                </div>

                <!-- 추가 옵션: +버튼으로 여러 개 추가 -->
                <div class="form-row">
                    <label class="lang-text" data-ko="추가 옵션 (선택, 여러 개 가능)" data-en="Add-ons (optional, multiple allowed)">추가 옵션 (선택, 여러 개 가능)</label>
                    <div class="addon-buttons">
                        <button type="button" class="addon-add-btn" data-value="+ 배경 (50,000)" data-label="배경">+ 배경 추가</button>
                        <button type="button" class="addon-add-btn" data-value="+ 인원추가 (협의)" data-label="인원추가">+ 인원 추가</button>
                    </div>
                    <div id="addonSelected" class="tag-group addon-selected-group"></div>
                </div>

                <div class="form-row">
                    <label for="reqChar" class="lang-text" data-ko="캐릭터 / 리퀘스트 내용" data-en="Character / Request Details">캐릭터 / 리퀘스트 내용</label>
                    <textarea id="reqChar" name="reqChar" rows="4" required></textarea>
                </div>
                <div class="form-row">
                    <label for="reqDeadline" class="lang-text" data-ko="희망 마감일 (선택)" data-en="Preferred Deadline (optional)">희망 마감일 (선택)</label>
                    <input type="text" id="reqDeadline" name="reqDeadline">
                </div>
                <div class="form-row">
                    <label for="reqRef" class="lang-text" data-ko="레퍼런스 링크 (선택)" data-en="Reference Links (optional)">레퍼런스 링크 (선택)</label>
                    <input type="text" id="reqRef" name="reqRef">
                </div>
                <div class="form-row">
                    <label for="reqNote" class="lang-text" data-ko="추가 메모 (선택)" data-en="Additional Notes (optional)">추가 메모 (선택)</label>
                    <textarea id="reqNote" name="reqNote" rows="3"></textarea>
                </div>
                <input type="checkbox" name="botcheck" id="reqBotcheck" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;opacity:0;height:0;width:0">
            </form>

            <div class="form-actions">
                <button type="button" id="sendRequestBtn" class="apply-action-btn lang-text" data-ko="신청서 보내기" data-en="Send Request">신청서 보내기</button>
            </div>
            <p id="formHint" class="form-hint lang-text"
               data-ko="보내신 뒤 확인하고 입력하신 이메일로 승인 여부를 연락드립니다. 승인 연락을 받기 전에는 결제하지 말아 주세요."
               data-en="After you send it, I will review it and email you about approval. Please do not pay before you receive my approval.">
                보내신 뒤 확인하고 입력하신 이메일로 승인 여부를 연락드립니다. 승인 연락을 받기 전에는 결제하지 말아 주세요.
            </p>
            <p id="formStatus" class="form-hint" role="status" aria-live="polite"></p>
        </section>

    </div>

    <div id="scroll-top-btn" onclick="scrollToTop()">
        <img src="../assets/top_btn.png" class="top-btn-img" alt="Top">
    </div>

    <div class="bottom-nav-wrapper inverted-nav">
        <div class="nav-glow"></div>
        <nav id="main-nav" class="nav-bar">
            <div class="nav-bump-svg-container" onclick="toggleNav()">
                <svg viewBox="0 0 400 60" preserveAspectRatio="none" class="bump-svg">
                    <path d="M0,60 L110,60 Q140,60 150,40 L160,15 Q165,0 185,0 L215,0 Q235,0 240,15 L250,40 Q260,60 290,60 L400,60 Z"></path>
                </svg>
                <img src="../assets/star_icon.png" alt="Toggle" class="trigger-icon">
            </div>
            <ul class="nav-links">
                <li class="nav-item"><a href="../profile/index.html">PROFILE</a></li>
                <li class="nav-item"><a href="../portfolio/index.html">PORTFOLIO</a></li>
                <li class="nav-item center-home"><a href="../index.html" class="home-link-text">PATOHSI</a></li>
                <li class="nav-item"><a href="../blog/index.html">BLOG</a></li>
                <li class="nav-item"><a href="index.html">COMMISSION</a></li>
            </ul>
        </nav>
    </div>

    <script src="commission_script.js"></script>
    <script src="commission_request.js"></script>
</body>
</html>
