<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patohsi - Commission</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="commission_style.css">
    <link rel="stylesheet" href="commission_apply.css">
    <link rel="stylesheet" href="../assets/nav_peek.css">
</head>
<body>
    <div class="deco-x-group deco-left">
        <img loading="lazy" decoding="async" src="../assets/deco_x_blue.png" class="deco-x" alt=""><img loading="lazy" decoding="async" src="../assets/deco_x_blue.png" class="deco-x" alt=""><img loading="lazy" decoding="async" src="../assets/deco_x_blue.png" class="deco-x" alt="">
    </div>
    <div class="deco-x-group deco-right">
        <img loading="lazy" decoding="async" src="../assets/deco_x_blue.png" class="deco-x" alt=""><img loading="lazy" decoding="async" src="../assets/deco_x_blue.png" class="deco-x" alt=""><img loading="lazy" decoding="async" src="../assets/deco_x_blue.png" class="deco-x" alt=""><img loading="lazy" decoding="async" src="../assets/deco_x_blue.png" class="deco-x" alt=""><img loading="lazy" decoding="async" src="../assets/deco_x_blue.png" class="deco-x" alt="">
    </div>

    <div class="commission-container commission-apply-container">
        <div class="lang-switch-container">
            <button class="lang-btn active" onclick="setLanguage('ko')">KR</button>
            <span class="lang-divider"> </span>
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>

        <header class="header-area apply-header">
            <span class="small-label">COMMISSION</span>
            <h1 class="page-title lang-text" data-ko="어떤 의뢰인가요?" data-en="What kind of request?">어떤 의뢰인가요?</h1>
            <p class="apply-lead lang-text" data-ko="의뢰 종류를 선택해 주세요." data-en="Please choose the type of request.">의뢰 종류를 선택해 주세요.</p>
        </header>

        <section class="apply-method-grid">
            <article class="apply-card">
                <span class="apply-card-label">TYPE 01</span>
                <h2 class="apply-card-title lang-text" data-ko="외주" data-en="Outsourcing">외주</h2>
                <p class="apply-card-copy lang-text" data-ko="웹소설 삽화, 행사 포스터 같은 외주 작업 문의는 이쪽으로 와 주세요." data-en="For outsourced work such as web novel illustrations or event posters, start here.">웹소설 삽화, 행사 포스터 같은 외주 작업 문의는 이쪽으로 와 주세요.</p>
                <a href="outsource.html" class="apply-action-btn lang-text" data-ko="외주 문의하기" data-en="Outsourcing Inquiry">외주 문의하기</a>
            </article>
            <article class="apply-card">
                <span class="apply-card-label">TYPE 02</span>
                <h2 class="apply-card-title lang-text" data-ko="커미션 · 리퀘스트" data-en="Commission · Request">커미션 · 리퀘스트</h2>
                <p class="apply-card-copy lang-text" data-ko="개인 커미션과 리퀘스트 신청은 이쪽입니다. 가격표와 신청 방법을 볼 수 있어요." data-en="For personal commissions and requests. See the price list and how to apply.">개인 커미션과 리퀘스트 신청은 이쪽입니다. 가격표와 신청 방법을 볼 수 있어요.</p>
                <a href="commission.html" class="apply-action-btn secondary lang-text" data-ko="커미션 · 리퀘스트 보기" data-en="View Commission · Request">커미션 · 리퀘스트 보기</a>
            </article>
        </section>
    </div>

    <div id="scroll-top-btn" onclick="scrollToTop()">
        <img src="../assets/top_btn.png" class="top-btn-img" alt="Top">
    </div>

    <div class="bottom-nav-wrapper inverted-nav">
        <div class="nav-glow"></div>
        <nav id="main-nav" class="nav-bar">
            <div class="nav-bump-svg-container" onclick="toggleNav()">
                <svg viewBox="0 0 400 60" preserveAspectRatio="none" class="bump-svg">
                    <path d="M0,60 L110,60 Q140,60 150,40 L160,15 Q165,0 185,0 L215,0 Q235,0 240,15 L250,40 Q260,60 290,60 L400,60 Z"></path>
                </svg>
                <img src="../assets/star_icon.png" alt="Toggle" class="trigger-icon">
            </div>
            <ul class="nav-links">
                <li class="nav-item"><a href="../profile/index.html">PROFILE</a></li>
                <li class="nav-item"><a href="../portfolio/index.html">PORTFOLIO</a></li>
                <li class="nav-item center-home"><a href="../index.html" class="home-link-text">PATOHSI</a></li>
                <li class="nav-item"><a href="../blog/index.html">BLOG</a></li>
                <li class="nav-item"><a href="index.html">COMMISSION</a></li>
            </ul>
        </nav>
    </div>

    <script src="commission_script.js"></script>
    <script src="../assets/nav_peek.js"></script>
    <script src="../assets/smart_back.js"></script>
</body>
</html>
